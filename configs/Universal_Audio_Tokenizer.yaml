      path: "./data/sap/train.data.yodas.list"
      weight: 1
    hifi_tts:
      path: "./data/sap/train.data.hifi_tts.list"
      weight: 3
    vctk_tts:
      path: "./data/sap/train.data.vctk_tts.list"
      weight: 3
    libritts:
      path: "./data/sap/train.data.libritts.list"
      weight: 1
    aishell:
      path: "./data/sap/train.data.aishell_train.list"
      weight: 10
    wenetspeech:
      path: "./data/sap/train.data.wenetspeech.list"
